name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-bincache,readwrite
      VCPKG_DOWNLOADS: ${{ github.workspace }}\.vcpkg-downloads
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-bincache
            .vcpkg-downloads
          key: windows-vcpkg-${{ hashFiles('.github/workflows/ci.yml', 'CMakeLists.txt') }}
          restore-keys: |
            windows-vcpkg-
      - name: Bootstrap vcpkg dependencies
        shell: cmd
        run: |
          if not exist .tools mkdir .tools
          if not exist .vcpkg-bincache mkdir .vcpkg-bincache
          if not exist .vcpkg-downloads mkdir .vcpkg-downloads
          git clone https://github.com/microsoft/vcpkg .tools\vcpkg
          call .tools\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .tools\vcpkg\vcpkg.exe install sdl2:x64-windows ffmpeg:x64-windows zstd:x64-windows
      - name: Configure and build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ tools were not found." }
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -DevCmdArguments "-arch=x64 -host_arch=x64"
          cmake -S . -B build -G Ninja `
            -DASCII_USE_OPENCV=OFF `
            -DASCII_ENABLE_AVX2=OFF `
            -DBUILD_TESTS=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\.tools\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}\.tools\vcpkg\installed\x64-windows"
          cmake --build build --parallel 4
      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libsdl2-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libzstd-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DASCII_USE_OPENCV=OFF -DASCII_ENABLE_AVX2=OFF -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-homebrew-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            macos-homebrew-
      - name: Install dependencies
        run: brew list ninja sdl2 ffmpeg zstd >/dev/null 2>&1 || brew install ninja sdl2 ffmpeg zstd
      - name: Configure
        run: cmake -S . -B build -G Ninja -DASCII_USE_OPENCV=OFF -DASCII_ENABLE_AVX2=OFF -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix)"
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
